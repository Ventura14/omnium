name: ci

# No depende de la accion oficial gitleaks/gitleaks-action (requiere
# licencia de pago en repos privados de organizacion). Se descarga el
# binario directo de la release, que es MIT y gratis siempre.
#
# Ningun job de este archivo toca base de datos ni stack local (regla
# 10, CLAUDE.md): scan busca secretos en el historial de git, check
# corre tsc/eslint contra el codigo tal cual esta en el checkout. Si
# algun dia hace falta un job que si necesite Supabase, va en un
# archivo aparte, no aqui.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      - name: Escanear historial completo
        run: gitleaks git --redact --config .gitleaks.toml --verbose .

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # LayoutProps/PageProps son tipos globales que Next genera; sin esto
      # tsc falla en un checkout limpio (en local los deja `next dev`).
      - name: Generar tipos de Next
        run: pnpm exec next typegen

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Comandos de AGENTS.md existen de verdad
        run: bash .github/scripts/check-claude-commands.sh
